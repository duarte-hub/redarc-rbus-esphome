# Builds the public firmware for each board (XIAO ESP32-C6 and ESP32-C5) and publishes it for
# OTA updates.
#
# Release: push a tag like v2026.11.1. The unit's update entity reads
#   https://raw.githubusercontent.com/<owner>/<repo>/ota/manifest.json
# and the "ota" branch is replaced with the new manifest and images (one build per chip). The images are also
# attached to a GitHub release.
#
# Run it by hand (Actions -> Firmware -> Run workflow) to test a build without publishing.

name: Firmware

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware
  cancel-in-progress: false

env:
  ESPHOME_VERSION: "2026.11.0"
  # Board files in firmware/: redarc-camper = XIAO ESP32-C6, redarc-camper-c5 = XIAO ESP32-C5.
  CONFIGS: redarc-camper redarc-camper-c5
  NAME: redarc-camper   # node name, shared by the boards

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache ESP-IDF toolchain
        uses: actions/cache@v4
        with:
          path: ~/.cache/esphome
          key: esphome-${{ env.ESPHOME_VERSION }}

      - name: Install ESPHome
        run: pip install "esphome==${ESPHOME_VERSION}"

      - name: Version
        id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build web UI (generic icons)
        run: |
          python3 web/build.py
          cp web/redarc_ui.js firmware/

      - name: Compile
        run: |
          set -o pipefail
          for cfg in $CONFIGS; do
            echo "## $cfg" >> "$GITHUB_STEP_SUMMARY"
            esphome -s version "${{ steps.v.outputs.version }}" -s ref "${{ steps.v.outputs.ref }}" \
              compile "firmware/$cfg.yaml" 2>&1 | tee "build-$cfg.log"
            grep -E "^(RAM|Flash):|app partition" "build-$cfg.log" >> "$GITHUB_STEP_SUMMARY" || true
            # Every board builds into the same directory (same node name): keep the images now.
            mkdir -p "img/$cfg"
            cp "$(find firmware/.esphome/build/$NAME -name firmware.ota.bin | head -1)" "img/$cfg/ota.bin"
            cp "$(find firmware/.esphome/build/$NAME -name firmware.factory.bin | head -1)" "img/$cfg/factory.bin"
          done

      - name: Manifest
        run: |
          set -e
          mkdir -p out
          python3 - "${{ steps.v.outputs.version }}" <<'PY'
          import hashlib, json, os, shutil, sys
          v = sys.argv[1]
          repo = os.environ["GITHUB_REPOSITORY"]
          # One build per chip; a unit installs the build whose chipFamily matches its own chip.
          chips = {"redarc-camper": "ESP32-C6", "redarc-camper-c5": "ESP32-C5"}
          builds = []
          for cfg in os.environ["CONFIGS"].split():
              ota, factory = f"{cfg}-{v}.ota.bin", f"{cfg}-{v}.factory.bin"
              shutil.copy(f"img/{cfg}/ota.bin", f"out/{ota}")
              shutil.copy(f"img/{cfg}/factory.bin", f"out/{factory}")
              builds.append({
                  "chipFamily": chips[cfg],
                  "ota": {
                      "path": ota,
                      "md5": hashlib.md5(open(f"out/{ota}", "rb").read()).hexdigest(),
                      "release_url": f"https://github.com/{repo}/releases/tag/v{v}",
                      "summary": f"redarc-rbus-esphome {v}",
                  },
                  "parts": [{"path": factory, "offset": 0}],
              })
          manifest = {
              "name": "REDARC TVMS bridge",
              "version": v,
              "home_assistant_domain": "esphome",
              "builds": builds,
          }
          json.dump(manifest, open("out/manifest.json", "w"), indent=2)
          PY
          cat out/manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.v.outputs.version }}
          path: out/

      - name: Publish to the ota branch
        if: steps.v.outputs.publish == 'true'
        run: |
          cd out
          git init -q -b ota
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Firmware ${{ steps.v.outputs.version }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ota

      - name: GitHub release
        if: steps.v.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.bin
          generate_release_notes: true
