# Example ESPHome config: REDARC RedVision battery -> Home Assistant.
#
# Flash this to any ESP32 (classic ESP32 with Bluetooth; NOT an ESP32-C3/S3-only
# BLE-5 variant unless it supports BLE). The ESP32 connects to the Display,
# pairs once with the on-screen passkey, and publishes battery, charger, inverter
# and alarm state. Every entity is optional - delete the ones you don't want.

esphome:
  name: redarc-battery

esp32:
  board: esp32dev
  framework:
    type: esp-idf   # esp-idf is required for the BLE bonding/passkey APIs

logger:
api:
ota:
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Pull this component straight from GitHub.
external_components:
  - source:
      type: git
      url: https://github.com/duarte-hub/redarc-rbus-esphome
    components: [redarc_rbus]

# BLE central stack.
esp32_ble_tracker:
esp32_ble:
  io_capability: keyboard_only   # we type the passkey the Display shows

# The Display. MAC = u-blox NINA-B1 module address (OUI d4:ca:6e = u-blox AG).
# If yours differs, run an esp32_ble_tracker scan and look for "REDARC DISP4300 ...".
ble_client:
  - mac_address: D4:CA:6E:B6:1E:5F
    id: redarc_display

sensor:
  - platform: redarc_rbus
    id: redarc_hub
    ble_client_id: redarc_display
    passkey: 123456            # <-- the 6-digit code on Settings -> Bluetooth (no leading zero issues: it's an int)
    status_led: GPIO2
    # Link diagnostics (counts since boot)
    disconnects:
      name: "BLE Disconnects"
    pairing_requests:
      name: "Pairing Requests"
    state_of_charge:
      name: "Battery State of Charge"
    voltage:
      name: "Battery Voltage"
    current:
      name: "Battery Current"         # negative = discharging
    battery_power:
      name: "Battery Power"           # V x I, negative = discharging
    temperature:
      name: "Battery Temperature"
    state_of_health:
      name: "Battery State of Health"
    time_remaining:
      name: "Battery Time Remaining"  # minutes; + = to full, - = to flat
    load_current:
      name: "Load Current"
    solar_voltage:
      name: "Solar Voltage"
    solar_current:
      name: "Solar Current"
    solar_power:
      name: "Solar Power"
    dc_input_voltage:
      name: "DC Input Voltage"
    dc_input_current:
      name: "DC Input Current"
    ac_input_voltage:
      name: "AC Input Voltage"
    ac_input_current:
      name: "AC Input Current"
    charger_output_voltage:
      name: "Charger Output Voltage"
    charger_output_current:
      name: "Charger Output Current"
    inverter_output_voltage:
      name: "Inverter Output Voltage"
    inverter_power:
      name: "Inverter Power"
    # Configuration read-back (diagnostic entities)
    battery_capacity:
      name: "Battery Capacity"
    battery_max_charge_current:
      name: "Battery Max Charge Current"
    charger_max_output_current:
      name: "Charger Max Output Current"
    low_battery_soc_setpoint:
      name: "Low Battery SoC Alarm Set Point"
    low_battery_voltage_setpoint:
      name: "Low Battery Voltage Alarm Set Point"
    load_disconnect_voltage_off:
      name: "Load Disconnect Voltage Off"
    load_disconnect_voltage_on:
      name: "Load Disconnect Voltage On"
    load_disconnect_soc_off:
      name: "Load Disconnect SoC Off"
    load_disconnect_soc_on:
      name: "Load Disconnect SoC On"
    # History logs
    solar_energy_today:
      name: "Solar Energy Today"
    solar_energy_yesterday:
      name: "Solar Energy Yesterday"
    soc_min_last_day:
      name: "Battery SoC Min (Last Day)"
    soc_max_last_day:
      name: "Battery SoC Max (Last Day)"
    # Analog IO channels (raw values). On a TVMS the tank probes are on 21/22;
    # check against the Display and add unit/filters to suit.
    analog_channels:
      - channel: 21
        name: "Tank 1 Level"
        unit_of_measurement: "%"
      - channel: 22
        name: "Tank 2 Level"
        unit_of_measurement: "%"

binary_sensor:
  - platform: redarc_rbus
    redarc_rbus_id: redarc_hub
    ac_input_active:
      name: "AC Input Active"
    dc_input_active:
      name: "DC Input Active"
    solar_input_active:
      name: "Solar Input Active"
    charger_derating:
      name: "Charger Derating"
    inverter_on:
      name: "Inverter On"
    low_battery_soc_alarm:
      name: "Low Battery SoC Alarm"
    low_battery_voltage_alarm:
      name: "Low Battery Voltage Alarm"
    load_disconnect_active:
      name: "Load Disconnect Active"
    fault_active:
      name: "Fault Active"
    pairing_required:
      name: "Pairing Required"
    # Live state of any IO channel (outputs and digital inputs).
    digital_channels:
      - channel: 15
        name: "IO Channel 15"
    # Over/under alarms configured on analog channels (e.g. tanks).
    io_alarms:
      - channel: 21
        name: "Tank 1 Alarm"
      - channel: 22
        name: "Tank 2 Alarm"

text_sensor:
  - platform: redarc_rbus
    redarc_rbus_id: redarc_hub
    charging_stage:
      name: "Charging Stage"
    charging_mode:
      name: "Charging Mode"
    battery_chemistry:
      name: "Battery Chemistry"
    dc_input_trigger:
      name: "DC Input Trigger"
    load_disconnect_trigger:
      name: "Load Disconnect Trigger"
    # Why an output is in its state (Normal / Fuse Failed / Overridden by Load Disconnect ...).
    channel_status:
      - channel: 7
        name: "Main Light Status"
    channel_names:
      name: "Channel Names"
    active_faults:
      name: "Active Faults"
    link_status:
      name: "BLE Link Status"
    last_disconnect:
      name: "BLE Last Disconnect"
    last_pairing:
      name: "BLE Last Pairing"
    soc_hourly_log:
      name: "SoC Hourly Log"
    soc_daily_min_log:
      name: "SoC Daily Min Log"
    soc_daily_max_log:
      name: "SoC Daily Max Log"
    solar_daily_log:
      name: "Solar Daily Log"

# Settings the RedVision app can change; state follows the device.
select:
  - platform: redarc_rbus
    redarc_rbus_id: redarc_hub
    charging_mode:
      name: "Charging Mode"
    dc_input_trigger:
      name: "DC Input Trigger"

button:
  - platform: redarc_rbus
    redarc_rbus_id: redarc_hub
    sync_soc_full:
      name: "Sync Battery SoC to 100%"
    read_channel_names:
      name: "Read Channel Names"

# Output control by IO channel number, with real on/off read-back.
# Find a channel's number by toggling it in the app and watching the
# "Ack from node ... SPN 203 index N" debug log line.
switch:
  - platform: redarc_rbus
    redarc_rbus_id: redarc_hub
    name: "Main Light"
    channel: 7
  # Legacy alternative: replay captured frames (assumed state).
  # - platform: redarc_rbus
  #   redarc_rbus_id: redarc_hub
  #   name: "Main Light"
  #   on_frame:  "2f0024fa08cb00030701000000"
  #   off_frame: "2f0024fa08cb00030700000000"
