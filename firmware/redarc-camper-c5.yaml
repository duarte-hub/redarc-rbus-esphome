# Public firmware: REDARC TVMS bridge on a Seeed XIAO ESP32-C5
# (8 MB flash, 8 MB PSRAM, dual-band Wi-Fi 6, BLE 5, Zigbee; antenna on the U.FL connector).
#
# Same firmware as the XIAO ESP32-C6 build (everything shared is in common.yaml), with room to
# spare: full assert messages, Improv over Bluetooth as well as USB, and PSRAM for the BLE/Wi-Fi
# stacks. GitHub releases carry a build for each chip in one manifest; this board installs the
# ESP32-C5 one.
#
# First setup (USB, once):
#   1. Flash the release's redarc-camper-c5.factory.bin at https://web.esphome.io (Connect ->
#      Install), or "esphome run firmware/redarc-camper-c5.yaml".
#   2. Wi-Fi: Improv over USB on the same page (Configure Wi-Fi), or Improv over Bluetooth from
#      the Home Assistant app (Settings -> Devices -> the "Improv via BLE" discovery).
#   3. Add the device in Home Assistant; it provisions the API key.
#   4. Web UI Config page: enter the Display MAC, then Pair Now and the code the Display shows.
#   5. Zigbee: permit join in Zigbee2MQTT, then press "Zigbee Pair" on the unit.
#
# The board has no RF switch (unlike the C6): the antenna on the U.FL connector is the only one.
# Build locally: python3 web/build.py && cp web/redarc_ui.js firmware/ && esphome compile firmware/redarc-camper-c5.yaml

substitutions:
  name: redarc-camper
  friendly_name: REDARC Battery
  version: dev          # CI sets the release version (tag without the leading "v")
  ref: main             # git ref the components are fetched from; CI sets the release tag
  manifest_url: https://raw.githubusercontent.com/duarte-hub/redarc-rbus-esphome/ota/manifest.json
  # Onboard user LED (GPIO27, lights when driven low). GPIO27 is a strapping pin, which is fine for
  # the board's own LED, so its warning is turned off. For an external LED on D2 like the C6 unit:
  # GPIO25, inverted "false", strapping "false".
  status_led_pin: GPIO27
  status_led_inverted: "true"
  status_led_strapping: "true"
  # The C5 loses the Display about 1 s after asking it for new link timing before pairing.
  pairing_connection_params: "false"

packages:
  common: !include common.yaml

esp32:
  board: seeed_xiao_esp32c5
  flash_size: 8MB
  variant: esp32c5
  partitions: partitions-c5.csv
  framework:
    type: esp-idf
    advanced:
      # Keep a crash dump in the coredump partition so the next panic leaves a backtrace.
      include_builtin_idf_components: [espcoredump]
      # Only the generic flash driver (ESPHome's own suggestion at boot): frees IRAM.
      flash_chip: generic
    sdkconfig_options:
      CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH: y
      CONFIG_ESP_COREDUMP_DATA_FORMAT_ELF: y
      # The C5 has 384 KB of internal RAM (the C6 512 KB): with Wi-Fi, Zigbee and the web server
      # up, Bluetooth could not start (BTU_StartUp out of memory -> assert in list_begin). Let
      # ordinary allocations and the Bluetooth/Wi-Fi stacks use the 8 MB PSRAM; small blocks
      # (under 4 KB) stay internal for speed.
      CONFIG_SPIRAM_USE_CAPS_ALLOC: n
      CONFIG_SPIRAM_USE_MALLOC: y
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "4096"
      CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL: "49152"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: y
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: y
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: y
      CONFIG_BT_BLUEDROID_TASK_STACK_IN_EXT_MEM: y
      CONFIG_BT_BLUEDROID_BTU_TASK_STACK_IN_EXT_MEM: y
      # TLS for GitHub updates: its 16 KB record buffers did not fit in internal RAM either
      # (mbedtls_ssl_setup -0x7F00, "Failed to fetch manifest").
      CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC: n
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: y

psram:
  mode: quad
  speed: 80MHz

# Wi-Fi setup from a phone over Bluetooth (in addition to USB; there is flash for it on this board).
improv_ble:
  authorizer: none
